annotations:
  cost: none
  read_only: true
  requires_confirmation: false
description: Calculate statistical disproportionality metrics comparing observed vs
  expected event frequencies.
input_schema:
  additionalProperties: false
  properties:
    active_ingredient:
      type: string
    meddra_term:
      type: string
  required:
  - active_ingredient
  - meddra_term
  type: object
name: compute-prr-ebgm-signal
output_schema:
  additionalProperties: false
  properties:
    confidence:
      type: number
    data:
      type: string
    status:
      type: string
  required:
  - status
  - data
  type: object
