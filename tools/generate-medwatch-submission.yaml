annotations:
  cost: none
  read_only: true
  requires_confirmation: false
description: Synthesize validated case data into compliant FDA 3500A safety XML and
  PDF bundles.
input_schema:
  additionalProperties: false
  properties:
    case_id:
      type: string
    seriousness_criteria:
      type: string
  required:
  - case_id
  - seriousness_criteria
  type: object
name: generate-medwatch-submission
output_schema:
  additionalProperties: false
  properties:
    confidence:
      type: number
    data:
      type: string
    status:
      type: string
  required:
  - status
  - data
  type: object
